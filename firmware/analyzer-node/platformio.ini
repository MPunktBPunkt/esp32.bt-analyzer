; esp32.bt-analyzer — analyzer-node
;
; Primary: on-chip Bluetooth (VHCI) — no USB dongle required.
; Optional legacy: USB Host HCI when BT_ANALYZER_ENABLE_USB_HOST=1.
; Serial console: UART / COM — NOT the OTG USB port (shared PHY on S3).
; Lab: .88/.89 YD-ESP32-S3 N8R2 · .87 D1 Mini ESP32 (Classic+BLE).

[platformio]
default_envs = analyzer-s3
src_dir = src

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
platform_packages =
  tool-esptoolpy@https://github.com/pioarduino/esptool/releases/download/v5.6.0/esptool.zip
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DFW_VERSION=\"0.3.2\"
  -DHUB_HOST=\"192.168.178.113\"
  -DHUB_PORT=8093
  -DCONTROLLER_HOST_DEFAULT=\"192.168.178.187\"
  -DCONTROLLER_PORT_DEFAULT=9751
  -DBT_ANALYZER_ENABLE_USB_HOST=0
  -DCORE_DEBUG_LEVEL=1
  -I include
  -I src
  -I ../common/include
extra_scripts =
  pre:scripts/pack_ui_pre.py
  pre:scripts/gen_build_id.py

[env:analyzer-s3]
extends = common
board = esp32-s3-devkitc-1
board_build.partitions = partitions_analyzer_8mb.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_unflags =
  -DARDUINO_USB_MODE=1
lib_deps =
  ${common.lib_deps}
  tanakamasayuki/EspUsbHost@2.10.1
; Thin VHCI core — never pull Classic Audio Flavor into S3 measurement kernel.
build_src_filter =
  +<*>
  -<classic_flavor/>
build_flags =
  ${common.build_flags}
  -DBT_ANALYZER_BOARD_S3=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0

; D1 Mini / classic ESP32 — Classic BR/EDR + BLE on-chip (no USB Host / EspUsbHost).
[env:analyzer-esp32]
extends = common
board = esp32dev
board_build.partitions = partitions_analyzer_4mb.csv
board_upload.flash_size = 4MB
upload_speed = 921600
; Drop USB-HCI stubs — OTA slot on field .87 still 0x1E0000 (1966080) until serial repartition.
; Thin host only — Classic Audio Flavor stays out of default .87 image.
build_src_filter =
  +<*>
  -<usb/>
  -<hci/HciCapture.cpp>
  -<hci/HciUsbMap.cpp>
  -<classic_flavor/>
build_unflags =
  -DCORE_DEBUG_LEVEL=1
build_flags =
  ${common.build_flags}
  -Os
  -DCORE_DEBUG_LEVEL=0
  -DBT_ANALYZER_BOARD_ESP32=1
  -DBT_ANALYZER_CLASSIC=1
  -DBT_ANALYZER_ENABLE_USB_HOST=0

; BT17 scaffold — .87 only. Compiles ClassicAudioFlavor stubs; no A2DP/HFP stack yet.
; Do not OTA until Bluedroid phone-first path is wired (see docs/BT17_CLASSIC_AUDIO.md).
[env:analyzer-esp32-classic-audio]
extends = env:analyzer-esp32
build_src_filter =
  +<*>
  -<usb/>
  -<hci/HciCapture.cpp>
  -<hci/HciUsbMap.cpp>
build_unflags =
  ${env:analyzer-esp32.build_unflags}
  -DFW_VERSION=\"0.3.2\"
build_flags =
  ${env:analyzer-esp32.build_flags}
  -DBT_ANALYZER_CLASSIC_AUDIO_FLAVOR=1
  -DFW_VERSION=\"0.3.3-classic-scaffold\"

