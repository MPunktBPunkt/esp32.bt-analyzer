; esp32.bt-analyzer — analyzer-node
;
; Phase BT0: Hub / WiFi / Web UI / OTA / PSRAM.
; Phase BT1: USB Host enumeration (EspUsbHost) — no HCI decode yet.
; Toolchain aligned with usb-analyzer (pioarduino Arduino-ESP32 3.x).
; Serial console: UART / COM — NOT the OTG USB port (shared PHY).
; Lab board: YD-ESP32-S3 N8R2 (8 MiB flash + 2 MiB QSPI PSRAM).

[platformio]
default_envs = analyzer-s3
src_dir = src

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
platform_packages =
  tool-esptoolpy@https://github.com/pioarduino/esptool/releases/download/v5.6.0/esptool.zip
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1
  tanakamasayuki/EspUsbHost@2.10.1
build_flags =
  -DFW_VERSION=\"0.1.4\"
  -DHUB_HOST=\"192.168.178.113\"
  -DHUB_PORT=8093
  -DCONTROLLER_HOST_DEFAULT=\"192.168.178.187\"
  -DCORE_DEBUG_LEVEL=1
  -I include
  -I src
  -I ../common/include
extra_scripts =
  pre:scripts/pack_ui_pre.py
  pre:scripts/gen_build_id.py

[env:analyzer-s3]
extends = common
board = esp32-s3-devkitc-1
board_build.partitions = partitions_analyzer_8mb.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${common.build_flags}
  -DBT_ANALYZER_BOARD_S3=1
  -DBT_ANALYZER_ENABLE_USB_HOST=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0
